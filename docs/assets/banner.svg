<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="AY-PI: the right model and the right tools for every prompt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1036"/>
      <stop offset="0.55" stop-color="#2a1a5e"/>
      <stop offset="1" stop-color="#0c3b4a"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="28" fill="url(#glow)"/>

  <!-- wordmark -->
  <text x="88" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="132" font-weight="800" letter-spacing="-2" fill="url(#word)">AY-PI</text>
  <text x="92" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="500" fill="#e9e5ff">Right model, right tools, every prompt.</text>
  <text x="92" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="20" fill="#a5b4fc" opacity="0.85">a tier router for the Pi coding agent</text>

  <!-- tiers as steps: low, medium, high -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" text-anchor="middle">
    <rect x="860" y="196" width="104" height="56" rx="12" fill="#2dd4bf" opacity="0.9"/>
    <text x="912" y="230" fill="#0b2530" font-weight="700">low</text>
    <rect x="980" y="146" width="104" height="106" rx="12" fill="#818cf8" opacity="0.9"/>
    <text x="1032" y="230" fill="#14123a" font-weight="700">medium</text>
    <rect x="1100" y="86" width="104" height="166" rx="12" fill="#c084fc" opacity="0.9"/>
    <text x="1152" y="230" fill="#2a0f3f" font-weight="700">high</text>
  </g>
  <path d="M884 176 Q 960 120 1010 128 T 1128 66" fill="none" stroke="#e9e5ff" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" opacity="0.7"/>
  <circle cx="1128" cy="66" r="7" fill="#e9e5ff"/>
</svg>
